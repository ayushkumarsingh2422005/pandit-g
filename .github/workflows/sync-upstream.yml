# Sync this fork's main branch with the upstream repository.
# Runs on a schedule and can be triggered manually.
#
# Fork:  https://github.com/hiddenreview400-gif/pandit-g
# Upstream: https://github.com/ayushkumarsingh2422005/pandit-g

name: Sync fork with upstream

on:
  # Check upstream every 30 minutes for new commits.
  schedule:
    - cron: "*/30 * * * *"

  # Manual run: Actions tab → "Sync fork with upstream" → Run workflow
  workflow_dispatch:

# Prevent overlapping sync runs.
concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main into fork main
        env:
          UPSTREAM_REPO: ayushkumarsingh2422005/pandit-g
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main

          if git merge-base --is-ancestor HEAD upstream/main; then
            echo "Fork is already up to date with upstream/main."
            exit 0
          fi

          if git merge upstream/main --no-edit -m "chore: sync fork with upstream main"; then
            echo "Merged upstream/main successfully."
          else
            echo "::error::Merge conflict with upstream/main. Resolve manually on the fork."
            git merge --abort
            exit 1
          fi

      - name: Push synced main to fork
        run: git push origin main
